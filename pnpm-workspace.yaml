# 允许带 install 脚本的依赖执行构建（pnpm 默认拦截）
allowBuilds:
  # sass 文件监听（开发热更新）
  '@parcel/watcher': true
  # vite-plus / vitepress / vitest 间接依赖的原生二进制
  esbuild: true
  # vue-codemirror6 的 Vue2/3 兼容层（postinstall 切换入口）
  vue-demi: true

# Java 序列化：补丁支持 TC_CLASS / Externalizable（如 java.time）
patchedDependencies:
  java-object-serialization@0.1.2: patches/java-object-serialization@0.1.2.patch
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.e0f77ee2353b38c77d7165d3305f9f6d705b4d62
  vite-plus: 0.0.0-commit.e0f77ee2353b38c77d7165d3305f9f6d705b4d62
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
